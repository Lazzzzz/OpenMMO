revision = 32763

# Our server signs game and chat packets, so the client has to trust our keys instead.
[[patches]]
type = "binary_string"
name = "GamePubKey"
target = "@client"
find = "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEtqx2myJz3ftlYWgd7cbNqf2t208itQMY7ouPNBDpQetbi7eXbEDxDDZy4Q9fMnI6mF5/D0qMdRd40SRXf0OS7Q=="
replace_ref = "key.game.public"

[[patches]]
type = "binary_string"
name = "ChatPubKey"
target = "@client"
find = "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEh4Vqgnd+8Fqebu0H40v+FgwhE6RwgAYxJMihb8mJmcHDy8r/rPz3kLHH1oabyKIRUa5Y2cK0TsxZky+mp7DKWA=="
replace_ref = "key.chat.public"

# The client accepts a feed signed by either key, so the two slots are split. Slot 0 holds the
# published key that signs the hosted feed, slot 1 the key generated locally for the loopback feed,
# which is what lets development work without the production private key.
[[patches]]
type = "binary_string"
name = "FeedPubKey0"
target = "@client"
find = ""
replace = ""

[[patches]]
type = "binary_string"
name = "FeedPubKey1"
target = "@client"
find = ""
replace_ref = "key.feed.public"

# Also rewrites the /auth/ url, which carries this one as a prefix.
[[patches]]
type = "binary_string"
name = "SupportUrl"
target = "@client"
find = "https://support.pokemmo.com"
replace = "https://support.openmmo.dev"
